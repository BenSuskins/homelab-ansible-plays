---
- name: WORKBOARD - Create directory and permissions
  ansible.builtin.file:
    path: "{{ base_dir }}/workboard"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"

- name: WORKBOARD - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/bensuskins/workboard:latest

- name: WORKBOARD - Create container
  community.docker.docker_container:
    name: workboard
    image: ghcr.io/bensuskins/workboard:latest
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "3000:3000"
    volumes:
      - "{{ base_dir }}/workboard:/data"

- name: WORKBOARD - Define service entry
  ansible.builtin.set_fact:
    workboard_entry:
      name: workboard
      description: Work dashboard
      icon: kanboard
      host: "workboard.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 3000
      scheme: http
      secured: true
      healthcheck: true
      homepage: true
      proxied: true

- name: WORKBOARD - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [workboard_entry] }}"
