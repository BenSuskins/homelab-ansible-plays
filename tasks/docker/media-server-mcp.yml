---
- name: MEDIA-SERVER-MCP - Create container
  community.docker.docker_container:
    name: media-server-mcp
    image: ghcr.io/bensuskins/media-server-mcp:latest
    restart_policy: always
    state: started
    pull: true
    networks:
      - name: homelab
    ports:
      - "3200:3000"
    env:
      SONARR_URL: "http://{{ mediaserver_ip }}:8989"
      SONARR_API_KEY: "{{ SONARR_API_KEY }}"
      RADARR_URL: "http://{{ mediaserver_ip }}:7878"
      RADARR_API_KEY: "{{ RADARR_API_KEY }}"

- name: MEDIA-SERVER-MCP - Define service entry
  ansible.builtin.set_fact:
    media_server_mcp_entry:
      name: media-server-mcp
      description: Media server MCP (Sonarr/Radarr)
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 3200
      scheme: http
      healthcheck: true
      healthcheck_path: /mcp

- name: MEDIA-SERVER-MCP - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [media_server_mcp_entry] }}"
